name: Gemini CLI Assistant

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # Auto-label new issues
  auto-label:
    name: Auto Label Issues
    runs-on: ubuntu-latest
    if: github.event_name == 'issues' && github.event.action == 'opened'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Analyze and label issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const title = issue.title.toLowerCase();
            const body = (issue.body || '').toLowerCase();
            const labels = [];

            // Categorize by type
            if (title.includes('bug') || body.includes('bug') || body.includes('error') || body.includes('broken')) {
              labels.push('bug');
            } else if (title.includes('feature') || body.includes('feature') || body.includes('add') || body.includes('implement')) {
              labels.push('enhancement');
            } else if (title.includes('doc') || body.includes('documentation') || body.includes('readme')) {
              labels.push('documentation');
            }

            // Categorize by area
            if (body.includes('ui') || body.includes('style') || body.includes('css') || body.includes('design')) {
              labels.push('frontend');
            } else if (body.includes('logic') || body.includes('function') || body.includes('javascript')) {
              labels.push('backend');
            }

            // Priority
            if (title.includes('urgent') || body.includes('urgent') || title.includes('critical')) {
              labels.push('priority: high');
            }

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: labels
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `🤖 **Gemini CLI Assistant**: I've automatically categorized this issue with the following labels: ${labels.map(l => `\`${l}\``).join(', ')}\n\nTo delegate this task to me, mention **@gemini-cli** with your instructions!`
              });
            }

  # Handle task delegation with real Gemini API
  gemini-task:
    name: Handle Gemini Task
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      contains(github.event.comment.body, '@gemini-cli')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Setup Git
        run: |
          git config --global user.name "gemini-cli[bot]"
          git config --global user.email "gemini-cli[bot]@users.noreply.github.com"

      - name: Run Gemini Task Handler
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: node scripts/gemini-task-handler.js

  # Auto-review PRs with real Gemini API
  auto-review:
    name: Auto Review PR
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'opened'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Gemini PR Reviewer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/gemini-pr-reviewer.js

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 My Todo List</h1>
            <p class="subtitle">Keep track of your daily tasks</p>
        </header>

        <div class="input-section">
            <input
                type="text"
                id="todoInput"
                placeholder="What needs to be done?"
                autofocus
            >
            <input
                type="date"
                id="dueDateInput"
                title="Set due date"
            >
            <button id="addBtn" class="btn-add">Add Task</button>
        </div>

        <div class="controls-section">
            <div class="filter-section">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>
            <div class="sort-section">
                <button id="sortByDueDateBtn" class="sort-btn">Sort by Due Date</button>
            </div>
        </div>

        <ul id="todoList" class="todo-list"></ul>

        <div class="stats">
            <span id="taskCount">0 tasks remaining</span>
            <button id="clearCompleted" class="btn-clear">Clear Completed</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
